
{% extends "templates/web.html" %}

{% block page_content %}
<!-- MARKER-1 -->
<style>
    :root {
        --bd-border: #e5e7eb;
        --bd-muted:#6b7280;
        --bd-text:#111827;
        --bd-primary:#2563eb;
        --bd-primary-light:#eff6ff;
        --bd-bg:#f8fafc;
        --bd-card:#ffffff;
        --bd-green:#16a34a;
        --bd-yellow:#d97706;
        --bd-red:#dc2626;
    }
    body {
        background: var(--bd-bg);
        color:var(--bd-text);

    }
    .bd-wrapper{
        max-width: 1500px;
        margin:30px auto;
        padding:0 24px 50px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .bd-header{
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap:20px;
        margin-bottom: 24px;
    }

    .bd-title h1{
        margin:0 0 6px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    .bd-title p{
        margin: 0;
        color:var(--bd-muted);
        font-size: 14px;
    }
    .bd-actions{
        display: flex;
        gap:8px;
    }
    .bd-btn{
        border: 1px solid var(--bd-border);
        background:white;
        border-radius: 8px;
        padding:9px 14px;
        font-size: 13px;
        cursor: pointer;
        color: var(--bd-text);
    }
    

    .bd-btn:hover {
        background: #f3f4f6;
    }

    .bd-btn.primary {
        background: var(--bd-primary);
        color: white;
        border-color: var(--bd-primary);
    }

    .bd-tabs {
        display: flex;
        border-bottom: 1px solid var(--bd-border);
        margin-bottom: 18px;
        gap: 24px;
    }

    .bd-tab {
        padding: 12px 4px;
        border: 0;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        color: var(--bd-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
    }

    .bd-tab.active {
        color: var(--bd-primary);
        border-bottom-color: var(--bd-primary);
    }

    .bd-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 16px;
    }

    .bd-select,
    .bd-search,
    .bd-date {
        height: 38px;
        border: 1px solid var(--bd-border);
        border-radius: 7px;
        padding: 0 11px;
        background: white;
        color: var(--bd-text);
        font-size: 13px;
    }

    .bd-search {
        flex: 1;
        min-width: 220px;
    }

    .bd-date {
        width: 150px;
    }

    .bd-calendar-card {
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .bd-calendar-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 16px;
        border-bottom: 1px solid var(--bd-border);
    }

    .bd-date-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .bd-date-title {
        font-weight: 650;
        min-width: 180px;
        text-align: center;
        font-size: 14px;
    }

    .bd-nav-btn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--bd-border);
        border-radius: 7px;
        background: white;
        cursor: pointer;
    }

    .bd-legend {
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 12px;
        color: var(--bd-muted);
    }

    .bd-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
    }

    .dot-available { background: #22c55e; }
    .dot-booked { background: #3b82f6; }
    .dot-unavailable { background: #9ca3af; }

    
.bd-timeline {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    position: relative;
    scrollbar-gutter: stable;
}

.bd-timeline .bd-time-header,
.bd-timeline .bd-schedule-cell {
    width: 2400px;
    min-width: 2400px;
}


    .bd-grid {
        min-width: 1000px;
        display: grid;
        grid-template-columns: 210px 1fr;
    }

    .bd-resource-header {
        padding: 14px 16px;
        background: #f8fafc;
        border-right: 1px solid var(--bd-border);
        border-bottom: 1px solid var(--bd-border);
        font-size: 12px;
        font-weight: 650;
        color: var(--bd-muted);
        text-transform: uppercase;
        letter-spacing: .04em;
    }

 .bd-time-header {
    display: grid;
    grid-template-columns: repeat(24, 70px);
    width: max-content;
    min-width: 100%;
    background: #f8fafc;
    border-bottom: 1px solid var(--bd-border);
}


 .bd-time-cell {
    box-sizing: border-box;
    width: var(--bd-hour-width);
    min-width: var(--bd-hour-width);
    padding: 14px 8px;
    border-right: 1px solid var(--bd-border);
    font-size: 11px;
    color: var(--bd-muted);
    text-align: center;
    white-space: nowrap;
}

    .bd-resource-cell {
        min-height: 105px;
        padding: 14px 16px;
        border-right: 1px solid var(--bd-border);
        border-bottom: 1px solid var(--bd-border);
    }

    .bd-resource-name {
        font-size: 14px;
        font-weight: 650;
        margin-bottom: 4px;
    }

    .bd-resource-type {
        color: var(--bd-muted);
        font-size: 12px;
    }


.bd-schedule-cell {
    position: relative;
    min-height: 105px;
    min-width: 2400px;
    width: 2400px;
    border-bottom: 1px solid var(--bd-border);
    background-color: #f3f4f6;
    background-image: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 99px,
        #e5e7eb 99px,
        #e5e7eb 100px
    );
}

    .bd-availability {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(34, 197, 94, 0.045);
        pointer-events: none;
    }

    .bd-booking {
        position: absolute;
        top: 20px;
        height: 62px;
        min-width: 90px;
        padding: 8px 10px;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(37, 99, 235, .22);
        transition: transform .12s, box-shadow .12s;
    }
    .bd-booking {
    box-sizing: border-box;
}


    .bd-booking:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(37, 99, 235, .25);
    }

    .bd-booking.pending {
        background: #d97706;
    }

    .bd-booking.cancelled {
        background: #9ca3af;
        text-decoration: line-through;
    }

    .bd-booking.completed {
        background: #16a34a;
    }

    .bd-booking-title {
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


.bd-booking-title {
    line-height: 1.4;
}

    .bd-booking-time {
    display: flex;
    flex-direction: column;
        margin-top: 4px;
        font-size: 10px;
        opacity: .9;
        white-space: nowrap;
    }
    .bd-booking-time {
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
}

    .bd-empty {
        padding: 55px 20px;
        text-align: center;
        color: var(--bd-muted);
    }

    .bd-list {
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 12px;
        overflow: hidden;
    }

    .bd-list-row {
        display: grid;
        grid-template-columns: 130px 130px 1.2fr 1fr 130px;
        gap: 15px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--bd-border);
        align-items: center;
        font-size: 13px;
    }

    .bd-list-row.header {
        background: #f8fafc;
        color: var(--bd-muted);
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
    }

    .bd-status {
        display: inline-flex;
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 11px;
        font-weight: 650;
    }

    .bd-status.pending {
        background: #fff7ed;
        color: #c2410c;
    }

    .bd-status.cancelled {
        background: #f3f4f6;
        color: #6b7280;
    }

    .bd-status.completed {
        background: #f0fdf4;
        color: #15803d;
    }

    @media (max-width: 800px) {
        .bd-wrapper {
            padding: 0 12px 40px;
        }

        .bd-header {
            flex-direction: column;
        }

        .bd-legend {
            display: none;
        }

        .bd-list-row {
            grid-template-columns: 1fr 1fr;
        }

        .bd-list-row.header {
            display: none;
        }
    }

</style>
 
<div class="bd-wrapper">
    <div class="bd-header">
        <div class="bd-title">
            <h1>Booking Diary</h1>
            <p>Manage resource schedules, availability and bookings.</p>
        </div>
        <div class="bd-actions">
            <button class="bd-btn" onclick="window.location.reload()">Refresh</button>
        </div>
    </div>
    <div class="bd-tabs">
        <button class="bd-tab active" data-view="timeline">
TimeLine View
        </button>
        <button class="bd-tab" data-view="listing">
            Booking Listing
        </button>

    </div>

    <div class="bd-toolbar">
        <select  id="resourceFilter" class="bd-select">
            <option value="">All Resources</option>
            {% for resource in resources %}
            <option value="{{resource.name}}">
                {{resource.resource_name}}
            </option>
            {% endfor %}
        </select>
        <select id="statusFilter" class="bd-select">
            <option value="">All Status</option>
            <option value="Draft">Draft</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Completed">Completed</option>
            <option value="No Show">No Show</option>

        </select>
        <input type="search" name="" id="searchInput" class="bd-search" placeholder="Search resource, customer or booking...">
        <input type="date" id="datePicker" class="bd-date">
    </div>
    <section id="timelineView">
        <div class="bd-calendar-card">
            <div class="bd-calendar-toolbar">
                <div class="bd-date-controls">
                    <button class="bd-nav-btn" id="previousDay">‹</button>
                    <button class="bd-btn" id="todayButton">Today</button>
                    <button class="bd-nav-btn" id="nextDay">›</button>
                    <div class="bd-date-title" id="dateTitle"></div>
                    
                </div>
                <div class="bd-legend">
                    <span>
                        <i class="bd-dot dot-available"></i>
                        Available
                    </span>
                    <span><i class="bd-dot dot-booked"></i>
                        Booked</span>
                        <span>
                            <i class="bd-dot dot-unavailable"></i>
                            Unavailable
                        </span>
                    </div>
                </div>
                <div class="bd-timeline">
                    <div class="bd-grid">
                        <div class="bd-resource-header">
                            Resources
                        </div>
                        <div class="bd-time-header" id="timeHeader"></div>
                        <div id="resourceRows" style="display: contents;"></div>
                    </div>
            </div>  
        </div>
    </section>
    <section id="listingView" style="display: none;">
        <div class="bd-list">
            <div class="bd-list-row header">
                <div>Date</div>
                <div>Time</div>
                <div>Resource</div>
                <div>Customer</div>
                <div>Status</div>
            </div>
            <div id="bookingRows"></div>
        </div>
    </section>

 
<script>
    (function(){ 
        
const resources={{resources_json | safe}}
const bookings = {{bookings_json | safe}}
const availability = {{availability_json | safe}}

let START_HOUR = 0;
let END_HOUR = 24;
let TOTAL_HOURS = END_HOUR - START_HOUR;
let HOUR_WIDTH =100;

const MIN_HOUR_WIDTH = 100;
const RESOURCE_COLUMN_WIDTH = 210;


const datePicker = document.getElementById("datePicker");
const dateTitle = document.getElementById("dateTitle");
const resourceRows = document.getElementById("resourceRows");
const timeHeader = document.getElementById("timeHeader");
const bookingRows = document.getElementById("bookingRows");

let selectedDate = new Date();
selectedDate.setHours(0, 0, 0, 0);

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}

function displayDate(date) {
    return date.toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function timeToMinutes(value) {
    if (!value) return 0;

    const parts = String(value).split(":");

    return (
        parseInt(parts[0] || 0) * 60 +
        parseInt(parts[1] || 0)
    );

}

function userDateTimeToMinutes(isoString) {
    if (!isoString) return null;

    const date = new Date(isoString);

    const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: userTimeZone,
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
    }).formatToParts(date);

    const hour = Number(
        parts.find(part => part.type === "hour").value
    );

    const minute = Number(
        parts.find(part => part.type === "minute").value
    );

    return hour * 60 + minute;
}


function formatTime(value) {
    if (!value) return "";

    const parts = String(value).split(":");
    const hours = parseInt(parts[0]);
    const minutes = parseInt(parts[1] || 0);

    const suffix = hours >= 12 ? "PM" : "AM";
    const displayHour = hours % 12 || 12;

    return `${displayHour}:${String(minutes).padStart(2, "0")} ${suffix}`;
}

function getDayName(date) {
    return date.toLocaleDateString("en-US", {
        weekday: "long"
    });
}

function statusClass(status) {
    if (status === "Pending") return "pending";
    if (status === "Cancelled") return "cancelled";
    if (status === "Completed") return "completed";

    return "";
}

function filteredResources() {
    const selected = document.getElementById("resourceFilter").value;

    return resources.filter(resource => {
        if (selected && resource.name !== selected) {
            return false;
        }

        return true;
    });
}

function filteredBookings() {
    const resourceFilter =
        document.getElementById("resourceFilter").value;

    const statusFilter =
        document.getElementById("statusFilter").value;

    const search =
        document.getElementById("searchInput").value
            .trim()
            .toLowerCase();

    const date = formatDate(selectedDate);

    return bookings.filter(booking => {

        if (String(booking.booking_date) !== date) {
            return false;
        }

        if (
            resourceFilter &&
            booking.resource !== resourceFilter
        ) {
            return false;
        }

        if (
            statusFilter &&
            booking.status !== statusFilter
        ) {
            return false;
        }

        if (search) {
            const text = [
                booking.booking_id,
                booking.customer,
                booking.resource,
                booking.status,
                booking.remarks
            ]
            .join(" ")
            .toLowerCase();

            if (!text.includes(search)) {
                return false;
            }
        }

        return true;
    });
}




function renderTimeHeader() {
    timeHeader.innerHTML = "";

        

    for (let hour = START_HOUR; hour < END_HOUR; hour++) {
        const cell = document.createElement("div");
        cell.className = "bd-time-cell";
        cell.textContent =
            `${String(hour).padStart(2, "0")}:00`;

        timeHeader.appendChild(cell);
    }
}


let userTimeZone = "Asia/Kolkata";

async function getUserTimezone() {
    const response = await fetch(
        "/api/method/booking_diary.services.booking_schedule.get_user_timezone"
    );

    if (!response.ok) {
        throw new Error("Failed to fetch user timezone.");
    }

    const result = await response.json();
    userTimeZone = result.message || "UTC";
}
function formatUserDateTime(isoString) {
    if (!isoString) return "";

    return new Intl.DateTimeFormat("en-US", {
        timeZone: userTimeZone,
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        month: "short",
        day: "numeric",
    }).format(new Date(isoString));
}

async function getResourceSchedule(resource, date) {
    const response = await fetch(
        `/api/method/booking_diary.services.booking_schedule.get_user_day_schedule` +
        `?resource=${encodeURIComponent(resource)}` +
        `&user_date=${encodeURIComponent(date)}` +
        `&slot_duration=30` +
        `&user_timezone=${encodeURIComponent(userTimeZone)}`
    );

    if (!response.ok) {
        throw new Error("Failed to fetch user-day schedule.");
    }

    const result = await response.json();
    const data = result.message;

    // Combine the resource-local schedules into one result.
    return {
        ...data,
        slots: (data.schedules || []).flatMap(
            schedule => schedule.slots || []
        ),
        bookings: (data.schedules || []).flatMap(
            schedule => schedule.bookings || []
        ),
        is_blackout: (data.schedules || []).every(
            schedule => schedule.is_blackout
        ),
    };
}

function getTimelineRange(startISO, endISO, selectedDate) {
    if (!startISO || !endISO) return null;

    const selectedDay = formatDate(selectedDate);

    const getLocalParts = (iso) => {
        const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: userTimeZone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
        }).formatToParts(new Date(iso));

        const values = Object.fromEntries(
            parts.map(part => [part.type, part.value])
        );

        return {
            date: `${values.year}-${values.month}-${values.day}`,
            minutes: Number(values.hour) * 60 +
                     Number(values.minute),
        };
    };

    const start = getLocalParts(startISO);
    const end = getLocalParts(endISO);

    // Restrict the interval to the selected user's calendar day.
    if (start.date > selectedDay || end.date < selectedDay) {
        return null;
    }

    const startMinutes =
        start.date < selectedDay ? 0 : start.minutes;

    const endMinutes =
        end.date > selectedDay ? 1440 : end.minutes;

    if (endMinutes <= startMinutes) return null;

    return {
        start: startMinutes,
        end: endMinutes,
    };
}

function formatResourceTime(time) {
    if (!time) return "";

    const [hours, minutes] = String(time).split(":").map(Number);

    const date = new Date(2000, 0, 1, hours, minutes);

    return new Intl.DateTimeFormat("en-IN", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
    }).format(date);
}

async function renderTimeline() {

    dateTitle.textContent = displayDate(selectedDate);
    datePicker.value = formatDate(selectedDate);

    renderTimeHeader();

    const selectedBookings = filteredBookings();
    const selectedResources = filteredResources();
    const statusFilter =
    document.getElementById("statusFilter").value;

const search =
    document.getElementById("searchInput").value
        .trim()
        .toLowerCase();
    
    const schedules = {};

for (const resource of selectedResources) {
    try {
        schedules[resource.name] = await getResourceSchedule(
            resource.name,
            formatDate(selectedDate)
        );
    } catch (error) {
        console.error(
            `Failed to load schedule for ${resource.name}:`,
            error
        );

        schedules[resource.name] = null;
    }
}
// Find the earliest hour with availability across all resources.
// Always display the complete user-local calendar day.
START_HOUR = 0;
END_HOUR = 24;
TOTAL_HOURS = 24;
// const timelineWidth = TOTAL_HOURS * HOUR_WIDTH;

// timeHeader.style.gridTemplateColumns =
//     `repeat(${TOTAL_HOURS}, ${HOUR_WIDTH}px)`;

// timeHeader.style.width = `${timelineWidth}px`;
const timeline = document.querySelector(".bd-timeline");

const availableWidth = Math.max(
    0,
    timeline.clientWidth - RESOURCE_COLUMN_WIDTH
);

HOUR_WIDTH = Math.max(
    MIN_HOUR_WIDTH,
    availableWidth / TOTAL_HOURS
);
timeline.style.setProperty("--bd-hour-width", `${HOUR_WIDTH}px`);


const timelineWidth = TOTAL_HOURS * HOUR_WIDTH;

const timeHeader = document.getElementById("timeHeader");

timeHeader.style.gridTemplateColumns =
    `repeat(${TOTAL_HOURS}, ${HOUR_WIDTH}px)`;

timeHeader.style.width = `${timelineWidth}px`;
timeHeader.style.minWidth = `${timelineWidth}px`;
renderTimeHeader();

    resourceRows.innerHTML = "";

    if (!selectedResources.length) {
        resourceRows.innerHTML = `
            <div style="grid-column: 1 / -1;">
                <div class="bd-empty">
                    No resources found.
                </div>
            </div>
        `;

        return;
    }

   selectedResources.forEach(resource => {

    const resourceCell = document.createElement("div");
    resourceCell.className = "bd-resource-cell";
    resourceCell.innerHTML = `
        <div class="bd-resource-name">
            ${resource.resource_name || resource.name}
        </div>
        <div class="bd-resource-type">
            ${resource.resource_type || "Resource"}
        </div>
    `;

    const scheduleCell = document.createElement("div");
    scheduleCell.style.width = `${timelineWidth}px`;
scheduleCell.style.minWidth = `${timelineWidth}px`;
    scheduleCell.className = "bd-schedule-cell";

   const schedule = schedules[resource.name];

const dayName = getDayName(selectedDate);

// No schedule returned
if (!schedule) {
    scheduleCell.innerHTML = `
        <div class="bd-empty" style="padding:30px">
            Schedule could not be loaded.
        </div>
    `;

    resourceRows.appendChild(resourceCell);
    resourceRows.appendChild(scheduleCell);

    return;
}

if (!schedule.slots.length) {
    scheduleCell.innerHTML = `
        <div class="bd-empty" style="padding:30px">
            Not available on ${dayName}
        </div>
    `;
}



    // ---- click to create booking ----


scheduleCell.onclick = (event) => {
    const rect = scheduleCell.getBoundingClientRect();
    const offsetX = event.clientX - rect.left;

    const startMinutes = Math.floor(
        (START_HOUR * 60 + (offsetX / HOUR_WIDTH) * 60) / 30
    ) * 30;

    const endMinutes = startMinutes + 60;

    if (startMinutes < 0 || endMinutes > 1440) {
        frappe.msgprint("Please select a valid time.");
        return;
    }

    // Convert a user-local date/time to an absolute instant.
    const toInstant = (dateString, minutes) => {
        const [year, month, day] = dateString.split("-").map(Number);
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;

        const target = Date.UTC(year, month - 1, day, hour, minute);
        let instant = target;

        for (let i = 0; i < 4; i++) {
            const parts = new Intl.DateTimeFormat("en-CA", {
                timeZone: userTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23",
            }).formatToParts(new Date(instant));

            const values = Object.fromEntries(
                parts.map(part => [part.type, part.value])
            );

            const represented = Date.UTC(
                Number(values.year),
                Number(values.month) - 1,
                Number(values.day),
                Number(values.hour),
                Number(values.minute)
            );

            instant += target - represented;
        }

        return new Date(instant);
    };

    const nextDate = new Date(selectedDate);
    nextDate.setDate(nextDate.getDate() + 1);

    const startDateString = formatDate(selectedDate);
    const endDateString = endMinutes === 1440
        ? formatDate(nextDate)
        : startDateString;

    const startInstant = toInstant(startDateString, startMinutes);
    const endInstant = toInstant(
        endDateString,
        endMinutes === 1440 ? 0 : endMinutes
    );

    const resourceTimezone = schedule.resource_timezone;

    const toResourceParts = (instant) => {
        const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: resourceTimezone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23",
        }).formatToParts(instant);

        const values = Object.fromEntries(
            parts.map(part => [part.type, part.value])
        );

        return {
            date: `${values.year}-${values.month}-${values.day}`,
            time: `${values.hour}:${values.minute}:${values.second}`,
        };
    };

    const resourceStart = toResourceParts(startInstant);
    const resourceEnd = toResourceParts(endInstant);

    if (resourceStart.date !== resourceEnd.date) {
        frappe.msgprint(
            "This booking crosses the resource's calendar day. Please select a different time."
        );
        return;
    }

    const resourceSchedule = schedule.schedules.find(
        item => item.date === resourceStart.date
    );

    if (!resourceSchedule) {
        frappe.msgprint("No schedule found for this resource-local date.");
        return;
    }

    const start = timeToMinutes(resourceStart.time);
    const end = timeToMinutes(resourceEnd.time);

    const selectedSlots = resourceSchedule.slots.filter(slot => {
        const slotStart = timeToMinutes(slot.start_time);
        const slotEnd = timeToMinutes(slot.end_time);

        return slotStart < end && slotEnd > start;
    });

    if (
        selectedSlots.length !== 2 ||
        selectedSlots.some(slot => slot.status !== "available")
    ) {
        frappe.msgprint("This time slot is not available.");
        return;
    }

    window.location.href =
        "/app/booking-diary/new-booking-diary-1" +
        "?resource=" + encodeURIComponent(resource.name) +
        "&booking_date=" + encodeURIComponent(resourceStart.date) +
        "&start_time=" + encodeURIComponent(resourceStart.time) +
        "&end_time=" + encodeURIComponent(resourceEnd.time);
};



    // ---- availability shading ----

    const availableSlots = schedule.slots.filter(
        slot => slot.status === "available"
    );

    availableSlots.forEach(slot => {
        const range = getTimelineRange(
            slot.start_time_user_datetime,
            slot.end_time_user_datetime,
            selectedDate
        );
        

        if (!range) return;

        const visibleStart = Math.max(
            range.start,
            START_HOUR * 60
        );

        const visibleEnd = Math.min(
            range.end,
            END_HOUR * 60
        );

        if (visibleEnd <= visibleStart) return;

        const left =
            ((visibleStart - START_HOUR * 60) /
                (TOTAL_HOURS * 60)) * 100;

        const width =
            ((visibleEnd - visibleStart) /
                (TOTAL_HOURS * 60)) * 100;

        const availableBlock = document.createElement("div");

        availableBlock.className = "bd-availability";
        availableBlock.style.left = `${left}%`;
        availableBlock.style.width = `${Math.max(width, 0)}%`;
        

        scheduleCell.appendChild(availableBlock);
    });

    // ---- booking blocks ----

const resourceBookings = schedule
    ? schedule.bookings.filter(booking => {
        if (statusFilter && booking.status !== statusFilter) {
            return false;
        }

        if (search) {
            const text = [
                booking.booking_id,
                booking.customer,
                resource.name,
                booking.status,
            ]
                .join(" ")
                .toLowerCase();

            if (!text.includes(search)) {
                return false;
            }
        }

        return true;
    })
    : [];

resourceBookings.forEach(booking => {
const range = getTimelineRange(
    booking.start_time_user_datetime,
    booking.end_time_user_datetime,
    selectedDate
);
console.log("BOOKING POSITION DEBUG", {
    booking: booking.booking_id,
    startISO: booking.start_time_user_datetime,
    endISO: booking.end_time_user_datetime,
    selectedDate: formatDate(selectedDate),
    range,
    START_HOUR,
    HOUR_WIDTH,
    TOTAL_HOURS
});

if (!range) return;

const visibleStart = Math.max(range.start, START_HOUR * 60);
const visibleEnd = Math.min(range.end, END_HOUR * 60);

if (visibleEnd <= visibleStart) return;

const left =
    ((visibleStart - START_HOUR * 60) / (TOTAL_HOURS * 60)) * 100;

const width =
    ((visibleEnd - visibleStart) / (TOTAL_HOURS * 60)) * 100;
            const bookingBlock = document.createElement("div");

bookingBlock.className =
    `bd-booking ${statusClass(booking.status)}`;

bookingBlock.style.left = `${left}%`;
bookingBlock.style.width = `${Math.max(width, 7)}%`;
        console.log("BOOKING CSS DEBUG", {
    booking: booking.booking_id,
    left: bookingBlock.style.left,
    width: bookingBlock.style.width,
    computedLeft: getComputedStyle(bookingBlock).left,
    position: getComputedStyle(bookingBlock).position,
    parentWidth: scheduleCell.clientWidth,
    parentClass: scheduleCell.className
});

const userStartTime = formatUserDateTime(booking.start_time_user_datetime)
const userEndTime = formatUserDateTime(booking.end_time_user_datetime)
    bookingBlock.title =
        `${booking.booking_id || booking.name} • ` +
        `${userStartTime} - ` +
        `${userEndTime}`;

    
const startLabel = formatResourceTime(booking.start_time);
const endLabel = formatResourceTime(booking.end_time);

   
bookingBlock.innerHTML = `
    <div class="bd-booking-title">
        ${booking.booking_id || booking.name}
    </div>
    <div class="bd-booking-time">
        ${startLabel} – ${endLabel}
        <span>${resource.time_zone}</span>
    </div>
`;

    bookingBlock.onclick = (event) => {
        event.stopPropagation();

        window.location.href =
            `/app/booking-diary/${booking.name}`;
    };

    scheduleCell.appendChild(bookingBlock);
});

    resourceRows.appendChild(resourceCell);
    resourceRows.appendChild(scheduleCell);
});
}
       

function renderListing() {

    const selectedBookings = filteredBookings();

    bookingRows.innerHTML = "";

    if (!selectedBookings.length) {
        bookingRows.innerHTML = `
            <div class="bd-empty">
                No bookings found for this date.
            </div>
        `;

        return;
    }

    selectedBookings.forEach(booking => {

        const resource =
            resources.find(item =>
                item.name === booking.resource
            );

        const row = document.createElement("div");

        row.className = "bd-list-row";

        row.innerHTML = `
            <div>
                ${new Date(
                    booking.booking_date + "T00:00:00"
                ).toLocaleDateString("en-IN")}
            </div>

            <div>
                ${formatTime(booking.start_time)}
                -
                ${formatTime(booking.end_time)}
            </div>

            <div>
                <strong>
                    ${resource?.resource_name || booking.resource}
                </strong>
            </div>

            <div>
                ${booking.customer || "—"}
            </div>

            <div>
                <span class="bd-status ${statusClass(booking.status)}">
                    ${booking.status}
                </span>
            </div>
        `;

        row.style.cursor = "pointer";

        row.onclick = () => {
            window.location.href =
                `/app/booking-diary/${booking.name}`;
        };

        bookingRows.appendChild(row);
    });
}

function render() {
    renderTimeline();
    renderListing();
}

document.getElementById("previousDay").onclick = () => {
    selectedDate.setDate(selectedDate.getDate() - 1);
    render();
};

document.getElementById("nextDay").onclick = () => {
    selectedDate.setDate(selectedDate.getDate() + 1);
    render();
};

document.getElementById("todayButton").onclick = () => {
    selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);
    render();
};

datePicker.onchange = () => {
    selectedDate = new Date(datePicker.value + "T00:00:00");
    render();
};

document.getElementById("resourceFilter").onchange = render;
document.getElementById("statusFilter").onchange = render;
document.getElementById("searchInput").oninput = render;

document.querySelectorAll(".bd-tab").forEach(tab => {

    tab.onclick = () => {

        document
            .querySelectorAll(".bd-tab")
            .forEach(item => item.classList.remove("active"));

        tab.classList.add("active");

        const view = tab.dataset.view;

        document.getElementById("timelineView").style.display =
            view === "timeline" ? "block" : "none";

        document.getElementById("listingView").style.display =
            view === "listing" ? "block" : "none";

        render();
    };
});

getUserTimezone()
    .then(() => render())
    .catch(error => {
        console.error("Failed to initialize timezone:", error);
        render();
    });

})();
</script>
