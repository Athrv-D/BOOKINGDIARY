
{% extends "templates/web.html" %}

{% block page_content %}
<!-- MARKER-1 -->
<style>
    :root {
        --bd-border: #e5e7eb;
        --bd-muted:#6b7280;
        --bd-text:#111827;
        --bd-primary:#2563eb;
        --bd-primary-light:#eff6ff;
        --bd-bg:#f8fafc;
        --bd-card:#ffffff;
        --bd-green:#16a34a;
        --bd-yellow:#d97706;
        --bd-red:#dc2626;
    }
    body {
        background: var(--bd-bg);
        color:var(--bd-text);

    }
    .bd-wrapper{
        max-width: 1500px;
        margin:30px auto;
        padding:0 24px 50px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .bd-header{
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap:20px;
        margin-bottom: 24px;
    }

    .bd-title h1{
        margin:0 0 6px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    .bd-title p{
        margin: 0;
        color:var(--bd-muted);
        font-size: 14px;
    }
    .bd-actions{
        display: flex;
        gap:8px;
    }
    .bd-btn{
        border: 1px solid var(--bd-border);
        background:white;
        border-radius: 8px;
        padding:9px 14px;
        font-size: 13px;
        cursor: pointer;
        color: var(--bd-text);
    }
    

    .bd-btn:hover {
        background: #f3f4f6;
    }

    .bd-btn.primary {
        background: var(--bd-primary);
        color: white;
        border-color: var(--bd-primary);
    }

    .bd-tabs {
        display: flex;
        border-bottom: 1px solid var(--bd-border);
        margin-bottom: 18px;
        gap: 24px;
    }

    .bd-tab {
        padding: 12px 4px;
        border: 0;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        color: var(--bd-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
    }

    .bd-tab.active {
        color: var(--bd-primary);
        border-bottom-color: var(--bd-primary);
    }

    .bd-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 16px;
    }

    .bd-select,
    .bd-search,
    .bd-date {
        height: 38px;
        border: 1px solid var(--bd-border);
        border-radius: 7px;
        padding: 0 11px;
        background: white;
        color: var(--bd-text);
        font-size: 13px;
    }

    .bd-search {
        flex: 1;
        min-width: 220px;
    }

    .bd-date {
        width: 150px;
    }

    .bd-calendar-card {
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .bd-calendar-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 16px;
        border-bottom: 1px solid var(--bd-border);
    }

    .bd-date-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .bd-date-title {
        font-weight: 650;
        min-width: 180px;
        text-align: center;
        font-size: 14px;
    }

    .bd-nav-btn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--bd-border);
        border-radius: 7px;
        background: white;
        cursor: pointer;
    }

    .bd-legend {
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 12px;
        color: var(--bd-muted);
    }

    .bd-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
    }

    .dot-available { background: #22c55e; }
    .dot-booked { background: #3b82f6; }
    .dot-unavailable { background: #9ca3af; }

    .bd-timeline {
        overflow-x: auto;
    }

    .bd-grid {
        min-width: 1000px;
        display: grid;
        grid-template-columns: 210px 1fr;
    }

    .bd-resource-header {
        padding: 14px 16px;
        background: #f8fafc;
        border-right: 1px solid var(--bd-border);
        border-bottom: 1px solid var(--bd-border);
        font-size: 12px;
        font-weight: 650;
        color: var(--bd-muted);
        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .bd-time-header {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        background: #f8fafc;
        border-bottom: 1px solid var(--bd-border);
    }

    .bd-time-cell {
        padding: 14px 8px;
        border-right: 1px solid var(--bd-border);
        font-size: 11px;
        color: var(--bd-muted);
        text-align: center;
    }

    .bd-resource-cell {
        min-height: 105px;
        padding: 14px 16px;
        border-right: 1px solid var(--bd-border);
        border-bottom: 1px solid var(--bd-border);
    }

    .bd-resource-name {
        font-size: 14px;
        font-weight: 650;
        margin-bottom: 4px;
    }

    .bd-resource-type {
        color: var(--bd-muted);
        font-size: 12px;
    }

 .bd-schedule-cell {
    position: relative;
    min-height: 105px;
    border-bottom: 1px solid var(--bd-border);

    background:
        repeating-linear-gradient(
            to right,
            #f3f4f6 0,
            #f3f4f6 calc(11.111% - 1px),
            #e5e7eb calc(11.111% - 1px),
            #e5e7eb 11.111%
        );
}
    .bd-availability {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(34, 197, 94, 0.045);
        pointer-events: none;
    }

    .bd-booking {
        position: absolute;
        top: 20px;
        height: 62px;
        min-width: 90px;
        padding: 8px 10px;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(37, 99, 235, .22);
        transition: transform .12s, box-shadow .12s;
    }

    .bd-booking:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(37, 99, 235, .25);
    }

    .bd-booking.pending {
        background: #d97706;
    }

    .bd-booking.cancelled {
        background: #9ca3af;
        text-decoration: line-through;
    }

    .bd-booking.completed {
        background: #16a34a;
    }

    .bd-booking-title {
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bd-booking-time {
        margin-top: 4px;
        font-size: 10px;
        opacity: .9;
        white-space: nowrap;
    }

    .bd-empty {
        padding: 55px 20px;
        text-align: center;
        color: var(--bd-muted);
    }

    .bd-list {
        background: white;
        border: 1px solid var(--bd-border);
        border-radius: 12px;
        overflow: hidden;
    }

    .bd-list-row {
        display: grid;
        grid-template-columns: 130px 130px 1.2fr 1fr 130px;
        gap: 15px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--bd-border);
        align-items: center;
        font-size: 13px;
    }

    .bd-list-row.header {
        background: #f8fafc;
        color: var(--bd-muted);
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
    }

    .bd-status {
        display: inline-flex;
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 11px;
        font-weight: 650;
    }

    .bd-status.pending {
        background: #fff7ed;
        color: #c2410c;
    }

    .bd-status.cancelled {
        background: #f3f4f6;
        color: #6b7280;
    }

    .bd-status.completed {
        background: #f0fdf4;
        color: #15803d;
    }

    @media (max-width: 800px) {
        .bd-wrapper {
            padding: 0 12px 40px;
        }

        .bd-header {
            flex-direction: column;
        }

        .bd-legend {
            display: none;
        }

        .bd-list-row {
            grid-template-columns: 1fr 1fr;
        }

        .bd-list-row.header {
            display: none;
        }
    }

</style>
 
<div class="bd-wrapper">
    <div class="bd-header">
        <div class="bd-title">
            <h1>Booking Diary</h1>
            <p>Manage resource schedules, availability and bookings.</p>
        </div>
        <div class="bd-actions">
            <button class="bd-btn" onclick="window.location.reload()">Refresh</button>
        </div>
    </div>
    <div class="bd-tabs">
        <button class="bd-tab active" data-view="timeline">
TimeLine View
        </button>
        <button class="bd-tab" data-view="listing">
            Booking Listing
        </button>

    </div>

    <div class="bd-toolbar">
        <select  id="resourceFilter" class="bd-select">
            <option value="">All Resources</option>
            {% for resource in resources %}
            <option value="{{resource.name}}">
                {{resource.resource_name}}
            </option>
            {% endfor %}
        </select>
        <select id="statusFilter" class="bd-select">
            <option value="">All Status</option>
            <option value="Draft">Draft</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Completed">Completed</option>
            <option value="No Show">No Show</option>

        </select>
        <input type="search" name="" id="searchInput" class="bd-search" placeholder="Search resource, customer or booking...">
        <input type="date" id="datePicker" class="bd-date">
    </div>
    <section id="timelineView">
        <div class="bd-calendar-card">
            <div class="bd-calendar-toolbar">
                <div class="bd-date-controls">
                    <button class="bd-nav-btn" id="previousDay">‹</button>
                    <button class="bd-btn" id="todayButton">Today</button>
                    <button class="bd-nav-btn" id="nextDay">›</button>
                    <div class="bd-date-title" id="dateTitle"></div>
                    
                </div>
                <div class="bd-legend">
                    <span>
                        <i class="bd-dot dot-available"></i>
                        Available
                    </span>
                    <span><i class="bd-dot dot-booked"></i>
                        Booked</span>
                        <span>
                            <i class="bd-dot dot-unavailable"></i>
                            Unavailable
                        </span>
                    </div>
                </div>
                <div class="bd-timeline">
                    <div class="bd-grid">
                        <div class="bd-resource-header">
                            Resources
                        </div>
                        <div class="bd-time-header" id="timeHeader"></div>
                        <div id="resourceRows" style="display: contents;"></div>
                    </div>
            </div>  
        </div>
    </section>
    <section id="listingView" style="display: none;">
        <div class="bd-list">
            <div class="bd-list-row header">
                <div>Date</div>
                <div>Time</div>
                <div>Resource</div>
                <div>Customer</div>
                <div>Status</div>
            </div>
            <div id="bookingRows"></div>
        </div>
    </section>

    <!-- <script type="application/json" id="booking-data">
        {
            "resources":{{resource_json}},
            "bookings":{{bookings_json}},
            "availability":{{availability_json}}
        }
    </script> -->
    <!-- BJ-TEST: [{{ bookings_json }}] -->
<script>
    (function(){ 
        
const resources={{resources_json | safe}}
const bookings = {{bookings_json | safe}}
const availability = {{availability_json | safe}}

const START_HOUR = 9;
const END_HOUR = 18;
const TOTAL_HOURS = END_HOUR - START_HOUR;

const datePicker = document.getElementById("datePicker");
const dateTitle = document.getElementById("dateTitle");
const resourceRows = document.getElementById("resourceRows");
const timeHeader = document.getElementById("timeHeader");
const bookingRows = document.getElementById("bookingRows");

let selectedDate = new Date();
selectedDate.setHours(0, 0, 0, 0);

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}

function displayDate(date) {
    return date.toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function timeToMinutes(value) {
    if (!value) return 0;

    const parts = String(value).split(":");

    return (
        parseInt(parts[0] || 0) * 60 +
        parseInt(parts[1] || 0)
    );
}

function formatTime(value) {
    if (!value) return "";

    const parts = String(value).split(":");
    const hours = parseInt(parts[0]);
    const minutes = parseInt(parts[1] || 0);

    const suffix = hours >= 12 ? "PM" : "AM";
    const displayHour = hours % 12 || 12;

    return `${displayHour}:${String(minutes).padStart(2, "0")} ${suffix}`;
}

function getDayName(date) {
    return date.toLocaleDateString("en-US", {
        weekday: "long"
    });
}

function statusClass(status) {
    if (status === "Pending") return "pending";
    if (status === "Cancelled") return "cancelled";
    if (status === "Completed") return "completed";

    return "";
}

function filteredResources() {
    const selected = document.getElementById("resourceFilter").value;

    return resources.filter(resource => {
        if (selected && resource.name !== selected) {
            return false;
        }

        return true;
    });
}

function filteredBookings() {
    const resourceFilter =
        document.getElementById("resourceFilter").value;

    const statusFilter =
        document.getElementById("statusFilter").value;

    const search =
        document.getElementById("searchInput").value
            .trim()
            .toLowerCase();

    const date = formatDate(selectedDate);

    return bookings.filter(booking => {

        if (String(booking.booking_date) !== date) {
            return false;
        }

        if (
            resourceFilter &&
            booking.resource !== resourceFilter
        ) {
            return false;
        }

        if (
            statusFilter &&
            booking.status !== statusFilter
        ) {
            return false;
        }

        if (search) {
            const text = [
                booking.booking_id,
                booking.customer,
                booking.resource,
                booking.status,
                booking.remarks
            ]
            .join(" ")
            .toLowerCase();

            if (!text.includes(search)) {
                return false;
            }
        }

        return true;
    });
}

function renderTimeHeader() {
    timeHeader.innerHTML = "";

    for (let hour = START_HOUR; hour < END_HOUR; hour++) {
        const cell = document.createElement("div");
        cell.className = "bd-time-cell";

        const suffix = hour >= 12 ? "PM" : "AM";
        const displayHour = hour % 12 || 12;

        cell.textContent = `${displayHour} ${suffix}`;

        timeHeader.appendChild(cell);
    }
}
async function getResourceSchedule(resource, date) {
    const response = await fetch(
        `/api/method/booking_diary.services.booking_schedule.get_schedule` +
        `?resource=${encodeURIComponent(resource)}` +
        `&booking_date=${encodeURIComponent(date)}`
    );

    if (!response.ok) {
        throw new Error("Failed to fetch resource schedule.");
    }

    const result = await response.json();

    return result.message;
}

async function renderTimeline() {

    dateTitle.textContent = displayDate(selectedDate);
    datePicker.value = formatDate(selectedDate);

    renderTimeHeader();

    const selectedBookings = filteredBookings();
    const selectedResources = filteredResources();
    const statusFilter =
    document.getElementById("statusFilter").value;

const search =
    document.getElementById("searchInput").value
        .trim()
        .toLowerCase();
    
    const schedules = {};

for (const resource of selectedResources) {
    try {
        schedules[resource.name] = await getResourceSchedule(
            resource.name,
            formatDate(selectedDate)
        );
    } catch (error) {
        console.error(
            `Failed to load schedule for ${resource.name}:`,
            error
        );

        schedules[resource.name] = null;
    }
}

    resourceRows.innerHTML = "";

    if (!selectedResources.length) {
        resourceRows.innerHTML = `
            <div style="grid-column: 1 / -1;">
                <div class="bd-empty">
                    No resources found.
                </div>
            </div>
        `;

        return;
    }

   selectedResources.forEach(resource => {

    const resourceCell = document.createElement("div");
    resourceCell.className = "bd-resource-cell";
    resourceCell.innerHTML = `
        <div class="bd-resource-name">
            ${resource.resource_name || resource.name}
        </div>
        <div class="bd-resource-type">
            ${resource.resource_type || "Resource"}
        </div>
    `;

    const scheduleCell = document.createElement("div");
    scheduleCell.className = "bd-schedule-cell";

   const schedule = schedules[resource.name];

const dayName = getDayName(selectedDate);

// No schedule returned
if (!schedule || !schedule.slots.length) {
    scheduleCell.innerHTML = `
        <div class="bd-empty" style="padding:30px">
            Not available on ${dayName}
        </div>
    `;

    resourceRows.appendChild(resourceCell);
    resourceRows.appendChild(scheduleCell);

    return;
}


// ---- click to create booking ----
scheduleCell.onclick = (event) => {

    const rect = scheduleCell.getBoundingClientRect();

    const percentage =
        (event.clientX - rect.left) / rect.width;

    const startMinutes =
        Math.round(
            (
                START_HOUR * 60 +
                percentage * TOTAL_HOURS * 60
            ) / 30
        ) * 30;

    const endMinutes = startMinutes + 60;


    // Find the backend-generated slots
    const selectedSlots = schedule.slots.filter(slot => {

        const slotStart =
            timeToMinutes(slot.start_time);

        const slotEnd =
            timeToMinutes(slot.end_time);

        return (
            slotStart < endMinutes &&
            slotEnd > startMinutes
        );
    });


    // Make sure the complete requested period
    // consists only of available slots
    const allAvailable =
        selectedSlots.length === 2 &&
        selectedSlots.every(
            slot => slot.status === "available"
        );


    if (!allAvailable) {
        frappe.msgprint(
            "This time slot is not available."
        );

        return;
    }


    const fmt = (minutes) =>
        `${String(Math.floor(minutes / 60)).padStart(2, "0")}:` +
        `${String(minutes % 60).padStart(2, "0")}:00`;


    window.location.href =
        "/app/booking-diary/new-booking-diary-1" +
        "?resource=" +
        encodeURIComponent(resource.name) +
        "&booking_date=" +
        encodeURIComponent(formatDate(selectedDate)) +
        "&start_time=" +
        encodeURIComponent(fmt(startMinutes)) +
        "&end_time=" +
        encodeURIComponent(fmt(endMinutes));
};


// ---- availability shading ----

const availableSlots = schedule.slots.filter(
    slot => slot.status === "available"
);


availableSlots.forEach(slot => {

    const start =
        timeToMinutes(slot.start_time);

    const end =
        timeToMinutes(slot.end_time);


    const visibleStart =
        Math.max(start, START_HOUR * 60);

    const visibleEnd =
        Math.min(end, END_HOUR * 60);


    if (visibleEnd <= visibleStart) {
        return;
    }


    const left =
        (
            (visibleStart - START_HOUR * 60) /
            (TOTAL_HOURS * 60)
        ) * 100;


    const width =
        (
            (visibleEnd - visibleStart) /
            (TOTAL_HOURS * 60)
        ) * 100;


    const availableBlock =
        document.createElement("div");

    availableBlock.className =
        "bd-availability";

    availableBlock.style.left =
        `${left}%`;

    availableBlock.style.width =
        `${Math.max(width, 0)}%`;


    scheduleCell.appendChild(
        availableBlock
    );
});
    // ---- booking blocks ----

const resourceBookings = schedule
    ? schedule.bookings.filter(booking => {
        if (statusFilter && booking.status !== statusFilter) {
            return false;
        }

        if (search) {
            const text = [
                booking.booking_id,
                booking.customer,
                resource.name,
                booking.status,
            ]
                .join(" ")
                .toLowerCase();

            if (!text.includes(search)) {
                return false;
            }
        }

        return true;
    })
    : [];

resourceBookings.forEach(booking => {
    const start = timeToMinutes(booking.start_time);
    const end = timeToMinutes(booking.end_time);

    const visibleStart = Math.max(start, START_HOUR * 60);
    const visibleEnd = Math.min(end, END_HOUR * 60);

    if (visibleEnd <= visibleStart) return;

    const left =
        ((visibleStart - START_HOUR * 60) /
            (TOTAL_HOURS * 60)) * 100;

    const width =
        ((visibleEnd - visibleStart) /
            (TOTAL_HOURS * 60)) * 100;

    const bookingBlock = document.createElement("div");

    bookingBlock.className =
        `bd-booking ${statusClass(booking.status)}`;

    bookingBlock.style.left = `${left}%`;

    bookingBlock.style.width =
        `${Math.max(width, 7)}%`;

    bookingBlock.title =
        `${booking.booking_id || booking.name} • ` +
        `${formatTime(booking.start_time)} - ` +
        `${formatTime(booking.end_time)}`;

    bookingBlock.innerHTML = `
        <div class="bd-booking-title">
            ${booking.booking_id || booking.name}
        </div>

        <div class="bd-booking-time">
            ${formatTime(booking.start_time)}
            -
            ${formatTime(booking.end_time)}
        </div>
    `;

    bookingBlock.onclick = (event) => {
        event.stopPropagation();

        window.location.href =
            `/app/booking-diary/${booking.name}`;
    };

    scheduleCell.appendChild(bookingBlock);
});

    resourceRows.appendChild(resourceCell);
    resourceRows.appendChild(scheduleCell);
});
}
       

function renderListing() {

    const selectedBookings = filteredBookings();

    bookingRows.innerHTML = "";

    if (!selectedBookings.length) {
        bookingRows.innerHTML = `
            <div class="bd-empty">
                No bookings found for this date.
            </div>
        `;

        return;
    }

    selectedBookings.forEach(booking => {

        const resource =
            resources.find(item =>
                item.name === booking.resource
            );

        const row = document.createElement("div");

        row.className = "bd-list-row";

        row.innerHTML = `
            <div>
                ${new Date(
                    booking.booking_date + "T00:00:00"
                ).toLocaleDateString("en-IN")}
            </div>

            <div>
                ${formatTime(booking.start_time)}
                -
                ${formatTime(booking.end_time)}
            </div>

            <div>
                <strong>
                    ${resource?.resource_name || booking.resource}
                </strong>
            </div>

            <div>
                ${booking.customer || "—"}
            </div>

            <div>
                <span class="bd-status ${statusClass(booking.status)}">
                    ${booking.status}
                </span>
            </div>
        `;

        row.style.cursor = "pointer";

        row.onclick = () => {
            window.location.href =
                `/app/booking-diary/${booking.name}`;
        };

        bookingRows.appendChild(row);
    });
}

function render() {
    renderTimeline();
    renderListing();
}

document.getElementById("previousDay").onclick = () => {
    selectedDate.setDate(selectedDate.getDate() - 1);
    render();
};

document.getElementById("nextDay").onclick = () => {
    selectedDate.setDate(selectedDate.getDate() + 1);
    render();
};

document.getElementById("todayButton").onclick = () => {
    selectedDate = new Date();
    selectedDate.setHours(0, 0, 0, 0);
    render();
};

datePicker.onchange = () => {
    selectedDate = new Date(datePicker.value + "T00:00:00");
    render();
};

document.getElementById("resourceFilter").onchange = render;
document.getElementById("statusFilter").onchange = render;
document.getElementById("searchInput").oninput = render;

document.querySelectorAll(".bd-tab").forEach(tab => {

    tab.onclick = () => {

        document
            .querySelectorAll(".bd-tab")
            .forEach(item => item.classList.remove("active"));

        tab.classList.add("active");

        const view = tab.dataset.view;

        document.getElementById("timelineView").style.display =
            view === "timeline" ? "block" : "none";

        document.getElementById("listingView").style.display =
            view === "listing" ? "block" : "none";

        render();
    };
});

render();

})();
</script>

{% endblock %}
